<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Translation Guard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">EDGE TRANSLATION GUARD</p>
      <h1>翻译修复保护</h1>
      <p id="site" class="site">正在读取网站…</p>
      <p id="status" class="status" role="status">正在读取保护状态…</p>
      <button id="toggle" type="button" disabled>请稍候</button>
      <p class="note">此设置只保存在本机。暂停保护不会关闭 Edge 自带翻译。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
